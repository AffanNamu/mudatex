# Local development only. NODE_ENV=development enables the shared dev token secret, which production refuses.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mudatex
      POSTGRES_PASSWORD: mudatex
      POSTGRES_DB: mudatex_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mudatex -d mudatex_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./apps/api
    command: ["node", "dist/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://mudatex:mudatex@db:5432/mudatex_dev
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./apps/api
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://mudatex:mudatex@db:5432/mudatex_dev
      AUTH_DEV_SECRET: local-dev-secret-local-dev-secret-0001
      CORS_ORIGINS: http://localhost:5173
      DEV_TOKEN_ENDPOINT: "true"
      SECRETS_ENCRYPTION_KEY: bG9jYWwtZGV2LU9OTFkta2V5LW5vdC1hLXNlY3JldCE=
      WEBHOOK_ALLOW_HTTP: "true"
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./apps/api
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://mudatex:mudatex@db:5432/mudatex_dev
      AUTH_DEV_SECRET: local-dev-secret-local-dev-secret-0001
      # Local only. Generate your own with: openssl rand -base64 32
      SECRETS_ENCRYPTION_KEY: bG9jYWwtZGV2LU9OTFkta2V5LW5vdC1hLXNlY3JldCE=
      WEBHOOK_ALLOW_HTTP: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
