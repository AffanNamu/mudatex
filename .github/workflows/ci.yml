name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mudatex
          POSTGRES_PASSWORD: mudatex
          POSTGRES_DB: mudatex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mudatex" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mudatex:mudatex@localhost:5432/mudatex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Dependency audit (all dependencies)
        run: npm audit --audit-level=high
      - name: Smoke test the built server on a fresh database
        env:
          DATABASE_URL: postgres://mudatex:mudatex@localhost:5432/mudatex_smoke
        run: |
          PGPASSWORD=mudatex psql -h localhost -U mudatex -d mudatex_test -c 'CREATE DATABASE mudatex_smoke'
          ./scripts/smoke.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mudatex
          POSTGRES_PASSWORD: mudatex
          POSTGRES_DB: mudatex_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mudatex" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Build the API the browser tests run against
        working-directory: apps/api
        run: npm ci && npm run build
      - name: Install the web console
        working-directory: apps/web
        run: npm ci
      - name: Typecheck, unit tests, audit
        working-directory: apps/web
        run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high
      - name: The Vercel build step writes its settings and security policy
        working-directory: apps/web
        run: |
          API_URL=https://api.example.test SUPABASE_URL=https://example.supabase.co SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci npm run build:vercel
          grep -q 'https://api.example.test' dist/config.js
          grep -q "connect-src 'self' https://api.example.test https://example.supabase.co" dist/index.html
      - name: Install the test browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests (sign-in, access, back office, till, accessibility, phone layout)
        working-directory: apps/web
        run: npm run e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  shop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mudatex
          POSTGRES_PASSWORD: mudatex
          POSTGRES_DB: mudatex_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mudatex" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/shop/package-lock.json
      - name: Build the API the browser tests run against
        working-directory: apps/api
        run: npm ci && npm run build
      - name: Install the customer shop
        working-directory: apps/shop
        run: npm ci
      - name: Typecheck, unit tests, audit
        working-directory: apps/shop
        run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high
      - name: Install the test browser
        working-directory: apps/shop
        run: npx playwright install --with-deps chromium
      - name: Browser tests (browsing, checkout, accessibility, phone layout)
        working-directory: apps/shop
        run: npm run e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shop-playwright-report
          path: |
            apps/shop/playwright-report
            apps/shop/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build the API image
        run: docker build -t mudatex-api:ci apps/api
      - name: Build the web console image and check its headers and runtime settings
        run: |
          docker build -t mudatex-web:ci apps/web
          docker run -d --name web -p 8080:8080 -e API_URL=https://api.example.test mudatex-web:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          # Captured first: `grep -q` closing a pipe early would fail a `pipefail` shell even when it matched.
          config=$(curl -fs http://127.0.0.1:8080/config.js); echo "$config"
          grep -q 'https://api.example.test' <<<"$config"
          # Every kind of response must carry the security headers (nginx drops outer headers when a location sets its own).
          for path in / /config.js /some/deep/link; do
            headers=$(curl -fsI "http://127.0.0.1:8080$path")
            grep -qi "content-security-policy:.*connect-src 'self' https://api.example.test" <<<"$headers" || { echo "missing CSP on $path"; echo "$headers"; exit 1; }
            grep -qi "x-content-type-options: nosniff" <<<"$headers" || { echo "missing nosniff on $path"; exit 1; }
          done
          page=$(curl -fs http://127.0.0.1:8080/)
          asset=$(grep -o '/assets/[^"]*\.js' <<<"$page" | head -1)
          headers=$(curl -fsI "http://127.0.0.1:8080$asset")
          grep -qi "content-security-policy:" <<<"$headers" || { echo "missing CSP on $asset"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/some/deep/link)" = "200"   # single-page app fallback
          docker rm -f web
          # refuses to start without a valid API_URL
          if docker run --rm -e API_URL=not-a-url mudatex-web:ci; then echo 'started with an invalid API_URL'; exit 1; fi
      - name: Container starts and answers its probes
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=development -e AUTH_DEV_SECRET=ci-secret-ci-secret-ci-secret-0001 \
            -e DATABASE_URL=postgres://mudatex:mudatex@127.0.0.1:5432/none mudatex-api:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/health
          # without a reachable database the container is alive but not ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ready)" = "503"
          docker rm -f api
