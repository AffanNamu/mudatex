name: Mudatex API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mudatex_test
          POSTGRES_USER: mudatex
          POSTGRES_PASSWORD: mudatex_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mudatex -d mudatex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mudatex:mudatex_test_only@localhost:5432/mudatex_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build
